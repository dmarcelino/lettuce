<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#111318" />
    <!-- A sensible icon before React mounts; lib/favicon.ts then tints it by
         connection state. Inline so there is no extra request and no binary. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171a21'/%3E%3Cpath d='M22 16v32h22' fill='none' stroke='%237aa2f7' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- iOS ignores a data-URI SVG here for Home Screen icons; needs a real PNG. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- `use-credentials` so the manifest (and its icon) fetches carry the
         Cloudflare Access cookie. Without it Chrome fetches the manifest
         anonymously, Access answers with its login page, the manifest fails to
         parse, and the app is not installable. In local mode there is no
         Access and the attribute is a harmless same-origin credentialed fetch.
         The static PWA paths should ALSO have an Access "Bypass" policy — see
         docker/README.md — so the icons load even on browsers that fetch them
         without credentials. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Home Screen install is required for Web Push on iOS — Safari only
         treats the app as "standalone" with these two set. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Letta" />
    <title>Letta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
