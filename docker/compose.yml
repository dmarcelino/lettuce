# Build context is the parent directory holding both repos:
#   docker compose -f letta-code-ui/docker/compose.yml up
#
# ── Why every service shares one network namespace ───────────────────────────
# The app-server refuses to listen on a non-loopback address without
# `--ws-auth` (app-server.ts: isUnauthenticatedNonLoopbackListener), but
# `letta channel-gateway` sends no bearer token at all (gateway-local.ts calls
# createAppServerClient with no authToken). Those two facts together mean
# Telegram is only reachable when the app-server listens on loopback with auth
# off — so the BFF and the gateway join the app-server's network namespace and
# reach it at 127.0.0.1:4500. Nothing outside that namespace can, which is
# stronger isolation than a shared token on a bridge network.
name: letta

services:
  app-server:
    build:
      # Our thin layer over the fork's own image, adding bubblewrap. The base
      # tag it needs is built by `bun run build-images` — Compose alone cannot
      # build A then FROM A.
      context: .
      dockerfile: app-server.Dockerfile
      args:
        # Pinned to the fork's own version, never `latest`. The UI is compiled
        # against this exact release's protocol types (see CLAUDE.md), so the
        # running app-server must match. The fork carries zero delta, so the
        # published package at this version is equivalent to our source.
        LETTA_CODE_VERSION: "${LETTA_CODE_VERSION:-0.31.13}"
    # Deliberate trade, not an oversight — and the argument list matters, so read
    # this before trimming anything from it.
    #
    # letta-code probes for bwrap with `--ro-bind / / --unshare-user`
    # (sandbox/availability.ts), but the policy it actually runs never passes
    # `--unshare-user` (sandbox/bwrap.ts buildBwrapArgs). bubblewrap running as
    # real root therefore takes its privileged path — no user namespace — and
    # calls unshare(CLONE_NEWNS) directly, which needs CAP_SYS_ADMIN. So the
    # probe can pass on a host where every wrapped command dies with
    # "bwrap: Creating new namespace failed: Operation not permitted". Measure
    # against buildBwrapArgs, never against the probe:
    #
    #   default caps                              FAIL
    #   cap_drop ALL                              FAIL  (uid 0 stays privileged)
    #   SYS_ADMIN, default seccomp + apparmor     FAIL
    #   SYS_ADMIN + seccomp unconfined only       FAIL
    #   SYS_ADMIN + apparmor unconfined only      FAIL
    #   SYS_ADMIN + BOTH unconfined               works
    #
    # All three are load-bearing; `privileged` is still not needed. (Running the
    # server as a non-root uid works with no added capability at all, because
    # bwrap then takes the unprivileged user-namespace path — but it needs the
    # letta-home and letta-data volumes chowned, so it is a migration, not a
    # flag.)
    #
    # What is given up: the default syscall filter and MAC profile that harden
    # container -> host, plus SYS_ADMIN — together that makes an escape from
    # this container materially easier, and this is the one service reachable
    # by agent-authored shell commands. What is gained is the cross-agent
    # profile described at LETTA_FS_SANDBOX below: no agent can read or write
    # another agent's memory. For a single-user, self-hosted assistant the
    # realistic threat is an agent or a prompt injection reading or clobbering
    # something it was never meant to see, not kernel exploitation from a
    # semi-trusted local process — so this is still the better side of the
    # trade. Revert it (and accept unconfined agents) if that ever stops being
    # true.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
    command:
      - letta
      - server
      - --listen
      - ws://127.0.0.1:4500
    # The image sets WORKDIR /workspace, which is container-layer storage: agent
    # files written there vanish on recreate. /work is the bind mount below, so
    # anchoring the boot CWD here is what makes agent work persist and be
    # visible on the host. Agents get /work/<agent-id>; /work is the shared level.
    working_dir: /work
    environment:
      # No Letta Cloud: agents, conversations and transcripts stay on disk here.
      LETTA_LOCAL_BACKEND_EXPERIMENTAL: "true"
      LETTA_LOCAL_BACKEND_DIR: /data/local-backend
      # getFallbackWorkingDirectory() prefers this over process.cwd().
      USER_CWD: /work
      # Confine every agent-spawned shell with bubblewrap, using letta-code's
      # CROSS-AGENT profile (permissions/sandbox-policy.ts
      # buildCrossAgentSandboxPolicy): writes allowed by default, both agents
      # trees masked with an empty tmpfs, and the current agent's own memory
      # roots bound back read-write. Measured inside this container with the
      # real argument list:
      #
      #   own memfs memory dir      writable
      #   /tmp                      writable
      #   /root/.letta              writable
      #   other agents' memfs       MASKED — `ls` shows only this agent
      #   /work/<other agent>       writable
      #
      # Chosen over `runtime_start`'s workspace_sandbox, which the UI used to
      # request, for three reasons measured against the running stack:
      #
      #  1. workspace_sandbox is a WRITE-SCOPED profile with exactly ONE
      #     writable root. Rooted at /work/<agent-id> it left the agent's own
      #     memory (/data/local-backend/memfs/<id>/memory), /tmp and
      #     /root/.letta all read-only — so an agent could not record anything
      #     it learned, and any tool reaching for a temp file failed. The
      #     protocol carries only {root, isolation_root}; policy.ts's
      #     baseWritableRoots would express "workspace plus /tmp plus memory"
      #     exactly, but nothing in the protocol reaches it.
      #  2. Its isolation root was /work, so it masked peer WORKSPACES while
      #     leaving every agent's MEMORY world-readable. This profile inverts
      #     that, and memory is the part worth hiding.
      #  3. Coverage was not uniform. workspace_sandbox lives on the
      #     per-conversation runtime, and cron (cron/scheduler.ts) and the
      #     channel gateway both create runtimes via
      #     getOrCreateConversationRuntime with no sandbox at all. Worse, a BFF
      #     upstream reconnect re-syncs known scopes, which creates a
      #     subscribed unsandboxed runtime; the browser's next runtime_start
      #     then trips assertRuntimeWorkspaceSandboxChangeAllowed and falls
      #     back to no sandbox for the life of that conversation. This flag is
      #     process env, so it covers every shell in every conversation —
      #     browser, cron, Telegram and subagents alike.
      #
      # What it does NOT do: agents are no longer confined to /work/<agent-id>,
      # so one can still write another's workspace files. Reads are never
      # restricted outside the agents trees (permissions/policy.ts says so
      # outright) and the network is untouched. In-process file tools are
      # covered separately and unconditionally by evaluateCrossAgentGuard.
      #
      # Changing this value recreates app-server, which drops the BFF's
      # permanent upstream connection — always `docker compose up -d` unscoped.
      LETTA_FS_SANDBOX: "1"
      # 30 minutes, up from letta-code's 5-minute default
      # (DEFAULT_LOCAL_PROVIDER_TIMEOUT_MS in backend/local/local-provider-timeout.ts).
      #
      # This buys PREFILL headroom, not longer generations. It arrives as the
      # OpenAI SDK's `timeout`, whose abort timer is cleared in a `finally` once
      # the fetch resolves — and a streaming fetch resolves on HEADERS. So it
      # bounds connect + queueing + prompt eval; once tokens flow the stream is
      # unbounded, and a mid-stream stall is not covered by anything at all.
      #
      # The global name is deliberate over the provider-specific
      # LETTA_CODE_OPENAI_COMPATIBLE_TIMEOUT_MS: there is one local provider
      # here, and the setting should follow it if the endpoint is ever swapped.
      # Milliseconds to match the variable name; the parser would also take
      # "30m", but an unparseable value throws rather than falling back.
      LETTA_CODE_LOCAL_PROVIDER_TIMEOUT_MS: "1800000"
    volumes:
      - letta-home:/root/.letta
      - letta-data:/data
      - ../../workspaces:/work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The UI port is published here because the BFF shares this namespace.
    # 0.0.0.0 by default: local mode's whole point is direct LAN reachability
    # with no Cloudflare involved. Switching to cloudflared mode (see the
    # `cloudflared` service below) means Access becomes the only gate that
    # matters, so pair `COMPOSE_PROFILES=cloudflared` with `BFF_BIND=127.0.0.1`
    # to close this direct-LAN door — Compose can't derive one setting's
    # default from another's value, so this is a manual pairing, not automatic.
    ports:
      - "${BFF_BIND:-0.0.0.0}:${BFF_PORT:-8090}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4500/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  bff:
    build:
      context: ../..
      dockerfile: letta-code-ui/docker/bff.Dockerfile
    depends_on:
      app-server:
        condition: service_healthy
    # Share the app-server's loopback; see the note at the top of this file.
    network_mode: "service:app-server"
    environment:
      PORT: "8080"
      LETTA_APP_SERVER_URL: ws://127.0.0.1:4500
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8090}
      # Pass-through of the exact same value that decides, at the Compose
      # level, whether the `cloudflared` service below even exists — one
      # setting (COMPOSE_PROFILES) drives both. "local" unless it contains
      # "cloudflared".
      LETTA_MODE: ${COMPOSE_PROFILES:-local}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      USERS_FILE: /app/config/users.json
      DEV_BYPASS_EMAIL: ${DEV_BYPASS_EMAIL:-}
      DEV_BYPASS_ALLOW_REMOTE: ${DEV_BYPASS_ALLOW_REMOTE:-}
      # Push is fully optional — leave all three unset to run without it.
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_CONTACT_EMAIL: ${PUSH_VAPID_CONTACT_EMAIL:-}
      PUSH_SUBSCRIPTIONS_FILE: /app/data/push-subscriptions.json
    volumes:
      - ../config/users.json:/app/config/users.json:ro
      # Push subscriptions are runtime state the BFF writes, not config — a
      # plain host directory (like config/ and workspaces/) rather than an
      # opaque named volume, so it stays inspectable and backupable.
      - ../../bff-data:/app/data
      # Same host directory the app-server mounts read-write at /work.
      # Read-only here: the BFF only needs `stat()` to report real modified
      # times for the Files tab (get_tree carries no mtime field, and the
      # fork cannot be patched to add one — see CLAUDE.md). It never lists
      # directories from this mount itself, only stats paths get_tree already
      # returned, so it can't show anything get_tree wouldn't have.
      - ../../workspaces:/work:ro
    restart: unless-stopped

  # Telegram and the other messaging channels. A separate process by design:
  # the app-server only dispatches channel_* commands when a gateway is
  # attached (message-router.ts: runtime.serviceCommandTypes), so without this
  # service every channel command returns silence.
  channel-gateway:
    build:
      context: ../../letta-code
      dockerfile: docker/Dockerfile
      args:
        LETTA_CODE_VERSION: "${LETTA_CODE_VERSION:-0.31.13}"
    depends_on:
      app-server:
        condition: service_healthy
    network_mode: "service:app-server"
    command:
      - letta
      - channel-gateway
      - --app-server-url
      - ws://127.0.0.1:4500
      - --restore-enabled-channels
      - --allow-startup-errors
    # Same anchor as the app-server: a gateway-initiated turn must not land in a
    # different directory from a browser-initiated one.
    working_dir: /work
    environment:
      LETTA_LOCAL_BACKEND_EXPERIMENTAL: "true"
      LETTA_LOCAL_BACKEND_DIR: /data/local-backend
      USER_CWD: /work
      # Deliberately NO LETTA_FS_SANDBOX here. The gateway is a relay: it hands
      # inbound channel messages to the app-server, which runs the turn and
      # executes every tool, so a gateway-initiated turn is already confined by
      # the app-server's flag. This image is the fork's own (no bubblewrap
      # layer), so setting it here would only log "sandbox backend unavailable".
      # The app-server owns scheduling; a second scheduler would fight for the lease.
      LETTA_DISABLE_CRON_SCHEDULER: "1"
    volumes:
      - letta-home:/root/.letta
      - letta-data:/data
      - ../../workspaces:/work
    restart: unless-stopped

  # Outbound-only, dashboard-managed tunnel: the public-hostname-to-origin
  # mapping lives in the Cloudflare Zero Trust dashboard (see docker/README.md),
  # not in a local config.yml. No ports, no network_mode — it joins Compose's
  # default network like any other service, which is what lets it resolve
  # `app-server` (the BFF's port 8080 answers there too — see the note above
  # `bff.network_mode`).
  #
  # profiles gates whether this container is even CREATED: with
  # COMPOSE_PROFILES unset (local mode, the default), `docker compose up -d`
  # skips it entirely. Set COMPOSE_PROFILES=cloudflared to opt in.
  #
  # TUNNEL_TOKEN stays soft-optional (`:-`, not `:?`) on purpose even though
  # cloudflared cannot run without one: Compose interpolates every service's
  # environment at parse time regardless of profile activation, so a hard
  # `:?` requirement here would break local mode's `up`/`build` even though
  # this container never gets created — that was exactly the placeholder-token
  # workaround this change removes. In cloudflared mode, an empty token just
  # means cloudflared itself fails at startup with an auth error (see its own
  # logs) — scoped to this one container, not the rest of the stack.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    command: tunnel --no-autoupdate run
    profiles: ["cloudflared"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  letta-home:
  letta-data:
