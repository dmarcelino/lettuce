# Build context is the parent directory holding both repos:
#   docker compose -f letta-code-ui/docker/compose.yml up
#
# ── Why every service shares one network namespace ───────────────────────────
# The app-server refuses to listen on a non-loopback address without
# `--ws-auth` (app-server.ts: isUnauthenticatedNonLoopbackListener), but
# `letta channel-gateway` sends no bearer token at all (gateway-local.ts calls
# createAppServerClient with no authToken). Those two facts together mean
# Telegram is only reachable when the app-server listens on loopback with auth
# off — so the BFF and the gateway join the app-server's network namespace and
# reach it at 127.0.0.1:4500. Nothing outside that namespace can, which is
# stronger isolation than a shared token on a bridge network.
name: letta

services:
  app-server:
    build:
      # Our thin layer over the fork's own image, adding bubblewrap. The base
      # tag it needs is built by `bun run build-images` — Compose alone cannot
      # build A then FROM A.
      context: .
      dockerfile: app-server.Dockerfile
      args:
        # Pinned to the fork's own version, never `latest`. The UI is compiled
        # against this exact release's protocol types (see CLAUDE.md), so the
        # running app-server must match. The fork carries zero delta, so the
        # published package at this version is equivalent to our source.
        LETTA_CODE_VERSION: "${LETTA_CODE_VERSION:-0.30.30}"
    # Deliberate trade, not an oversight. letta-code's sandbox probe runs a real
    # `bwrap --ro-bind / / --unshare-user` mount, and BOTH default profiles
    # block a different half of it — measured, not assumed:
    #
    #   (none)                          unshare blocked
    #   apparmor=unconfined only        unshare blocked      (seccomp stops it)
    #   seccomp=unconfined only         mount blocked        ("make / slave")
    #   seccomp + apparmor unconfined   works
    #   + cap_add SYS_ADMIN             works, and is NOT needed
    #
    # So this is the minimum that works: no added capabilities, not privileged.
    # Without it bubblewrap is installed but unusable and every agent runs
    # unconfined.
    #
    # What is given up: the default syscall filter and MAC profile that harden
    # container -> host. What is gained: the agent's shell commands are confined
    # to its own workspace directory, so one agent cannot write over another's
    # files. For a single-user, self-hosted assistant the realistic threat is an
    # agent or a prompt injection clobbering files, not kernel exploitation from
    # a semi-trusted local process — so this is the better side of the trade.
    # Revert it (and accept unconfined agents) if that ever stops being true.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    command:
      - letta
      - server
      - --listen
      - ws://127.0.0.1:4500
    # The image sets WORKDIR /workspace, which is container-layer storage: agent
    # files written there vanish on recreate. /work is the bind mount below, so
    # anchoring the boot CWD here is what makes agent work persist and be
    # visible on the host. Agents get /work/<agent-id>; /work is the shared level.
    working_dir: /work
    environment:
      # No Letta Cloud: agents, conversations and transcripts stay on disk here.
      LETTA_LOCAL_BACKEND_EXPERIMENTAL: "true"
      LETTA_LOCAL_BACKEND_DIR: /data/local-backend
      # getFallbackWorkingDirectory() prefers this over process.cwd().
      USER_CWD: /work
    volumes:
      - letta-home:/root/.letta
      - letta-data:/data
      - ../../workspaces:/work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The UI port is published here because the BFF shares this namespace.
    ports:
      - "${BFF_BIND:-0.0.0.0}:${BFF_PORT:-8090}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4500/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  bff:
    build:
      context: ../..
      dockerfile: letta-code-ui/docker/bff.Dockerfile
    depends_on:
      app-server:
        condition: service_healthy
    # Share the app-server's loopback; see the note at the top of this file.
    network_mode: "service:app-server"
    environment:
      PORT: "8080"
      LETTA_APP_SERVER_URL: ws://127.0.0.1:4500
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8090}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      USERS_FILE: /app/config/users.json
      DEV_BYPASS_EMAIL: ${DEV_BYPASS_EMAIL:-}
      DEV_BYPASS_ALLOW_REMOTE: ${DEV_BYPASS_ALLOW_REMOTE:-}
    volumes:
      - ../config/users.json:/app/config/users.json:ro
    restart: unless-stopped

  # Telegram and the other messaging channels. A separate process by design:
  # the app-server only dispatches channel_* commands when a gateway is
  # attached (message-router.ts: runtime.serviceCommandTypes), so without this
  # service every channel command returns silence.
  channel-gateway:
    build:
      context: ../../letta-code
      dockerfile: docker/Dockerfile
      args:
        LETTA_CODE_VERSION: "${LETTA_CODE_VERSION:-0.30.30}"
    depends_on:
      app-server:
        condition: service_healthy
    network_mode: "service:app-server"
    command:
      - letta
      - channel-gateway
      - --app-server-url
      - ws://127.0.0.1:4500
      - --restore-enabled-channels
      - --allow-startup-errors
    # Same anchor as the app-server: a gateway-initiated turn must not land in a
    # different directory from a browser-initiated one.
    working_dir: /work
    environment:
      LETTA_LOCAL_BACKEND_EXPERIMENTAL: "true"
      LETTA_LOCAL_BACKEND_DIR: /data/local-backend
      USER_CWD: /work
      # The app-server owns scheduling; a second scheduler would fight for the lease.
      LETTA_DISABLE_CRON_SCHEDULER: "1"
    volumes:
      - letta-home:/root/.letta
      - letta-data:/data
      - ../../workspaces:/work
    restart: unless-stopped

volumes:
  letta-home:
  letta-data:
